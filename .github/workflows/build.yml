name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # No Android SDK setup step: hosted runners ship the SDK with
      # ANDROID_HOME set. android-actions/setup-android@v3 fails on
      # current runners (it calls sdkmanager for the removed 'tools'
      # package), which killed the first CI build before Gradle ran.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.0"
      - name: Build debug
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
