name: Boundary Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  boundary-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check for restricted dependencies
        run: |
          OFFENDING_DEPS=$(grep -rnE "billingclient|play-services-ads|firebase-analytics|AdMob" gradle/libs.versions.toml app/build.gradle.kts build.gradle.kts settings.gradle.kts || true)
          if [ -n "$OFFENDING_DEPS" ]; then
            echo "ERROR: Restricted dependency (billing/ads/analytics) found in build files!"
            echo "$OFFENDING_DEPS"
            exit 1
          fi

      - name: Check for proprietary license headers
        run: |
          OFFENDING_FILES=$(find . -name "*.kt" -exec grep -Hni "proprietary" {} \; || true)
          if [ -n "$OFFENDING_FILES" ]; then
            echo "ERROR: Proprietary license text found in source files!"
            echo "$OFFENDING_FILES"
            exit 1
          fi

      - name: Check source manifest does not declare INTERNET
        run: |
          OFFENDING_SOURCE=$(grep -Hni "android.permission.INTERNET" app/src/main/AndroidManifest.xml | grep -v 'tools:node="remove"' || true)
          if [ -n "$OFFENDING_SOURCE" ]; then
            echo "ERROR: android.permission.INTERNET declared in app/src/main/AndroidManifest.xml without tools:node=\"remove\"!"
            echo "$OFFENDING_SOURCE"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check merged release manifest has zero INTERNET permission
        run: |
          ./gradlew :app:processReleaseManifest --stacktrace
          MERGED="app/build/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml"
          if grep -Hni "android.permission.INTERNET" "$MERGED"; then
            echo "ERROR: android.permission.INTERNET present in merged release manifest ($MERGED)!"
            exit 1
          fi
